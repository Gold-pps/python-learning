[project]
name = "python-learning"
version = "0.1.0"
description = "个人 Python 学习仓库：Agent 开发 + notes-qa 项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jieba>=0.42.1",
    "numpy>=2.5.3",
    "openai==3.8.0",
    "openai-agents==0.22.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv==1.2.3",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
rag = [
    "fastembed>=0.9.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["agent-learning/notes-qa/tests"]
pythonpath = ["agent-learning/notes-qa"]
