[project]
name = "python-learning"
version = "0.1.0"
description = "个人 Python 学习仓库：Agent 开发 + notes-qa 项目"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "jieba>=0.42.1",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "openai==3.8.0",
    "openai-agents==0.22.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv==1.2.3",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
rag = [
    "fastembed>=0.9.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["agent-learning/notes-qa/tests"]
pythonpath = ["agent-learning/notes-qa"]
# 本机的安全策略只允许 python 在**当前目录**里写（`%TEMP%` 不可写，`tempfile.gettempdir()`
# 会退化到仓库根目录 —— 台账 T60）。`--basetemp` 把 pytest 的临时目录固定到仓库内的
# `.pytest-tmp/`（已 gitignore），这样即使系统 TEMP 不可用，测试也不会往仓库根目录扔垃圾。
addopts = "--basetemp=.pytest-tmp"
